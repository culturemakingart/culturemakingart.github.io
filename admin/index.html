<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>사이트 관리 | 문화제작예술소</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="admin.css"><script src="../assets/js/site-api.js" defer></script><script src="admin.js" defer></script></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="../"><img src="../assets/img/logo.png" alt="문화제작예술소"></a><a href="../" target="_blank" rel="noopener">사이트 보기 ↗</a></div></header>
<main class="container admin"><h1>사이트 관리</h1><p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>관리자 로그인</h2><p>등록된 관리자 이메일로 로그인 링크를 받습니다. Supabase 대시보드 로그인과는 별개입니다.</p><form id="login-form"><label>이메일<input name="email" type="email" autocomplete="email" required value="culturemakingart@gmail.com"></label><button class="btn btn--primary">로그인 링크 받기</button></form></section>
<section id="dashboard" hidden><div class="toolbar"><button id="logout" class="btn">로그아웃</button><button id="refresh" class="btn">새로고침</button></div>
<nav class="toolbar" aria-label="관리 메뉴"><button class="btn" data-kind="home">홈</button><button class="btn" data-kind="about">단체 소개</button><button class="btn" data-kind="program">프로그램</button><button class="btn" data-kind="project">프로젝트</button><button class="btn" data-kind="inbox">문의함</button></nav>
<div id="content-panel"><div class="toolbar"><h2 id="section-title">홈</h2><button class="btn" id="add" hidden>새 항목 추가</button><button class="btn" id="import" hidden>기존 프로그램 16개 가져오기</button></div><div class="editor-layout"><div id="records"></div><form id="editor" hidden><p>저장하면 공개 여부에 따라 사이트에 바로 반영됩니다. 내용은 일반 텍스트로 입력해주세요.</p><div id="fields"></div><label><input type="checkbox" name="published"> 사이트에 공개</label><button class="btn btn--primary" id="save">저장</button></form></div></div>
<section id="inbox" hidden><h2>문의함</h2><p>최근 200건을 표시합니다. 답변은 이메일로 보내고 상태를 변경해주세요.</p><div id="inquiries"></div></section></section></main></body></html>
